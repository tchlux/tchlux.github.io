<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PA Psychology Law Study App</title>
  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.92);
      --panel-strong: #fffdf8;
      --text: #1f2933;
      --muted: #5c6b73;
      --line: #d8ccbb;
      --accent: #0f766e;
      --accent-soft: #d8f3ef;
      --right: #2f855a;
      --wrong: #c05621;
      --hard: #8b5cf6;
      --shadow: 0 10px 24px rgba(61, 43, 16, 0.05);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--text);
      font: 16px/1.5 "Avenir Next", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(15, 118, 110, 0.04), transparent 28%),
        radial-gradient(circle at top right, rgba(192, 86, 33, 0.04), transparent 24%),
        linear-gradient(180deg, #fbf7f0 0%, var(--bg) 100%);
    }

    body.quiz-screen { overflow: auto; }

    .app {
      max-width: 1120px;
      margin: 0 auto;
      padding: 24px;
    }

    .app.quiz-screen {
      max-width: 1480px;
      padding: 18px;
      min-height: 100vh;
      min-height: 100dvh;
    }

    .shell,
    .card,
    .quiz-shell,
    .quiz-block {
      background: var(--panel);
      border: 1px solid rgba(216, 204, 187, 0.9);
      border-radius: 14px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
    }

    .shell { padding: 22px; }
    .card { padding: 28px; margin-top: 18px; }

    .topline,
    .controls,
    .stats,
    .meta,
    .actions,
    .grade-row,
    .difficulty-row,
    .nav,
    .quiz-topbar,
    .quiz-summary,
    .quiz-actions,
    .quiz-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    .topline,
    .quiz-topbar { justify-content: space-between; gap: 16px; }
    .controls, .stats { margin-top: 16px; }
    .stats { color: var(--muted); font-size: 14px; }
    .stat {
      padding: 8px 12px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(216, 204, 187, 0.8);
    }
    a.stat,
    .source-link {
      color: var(--text);
      text-decoration: none;
    }
    a.stat:hover,
    .source-link:hover { text-decoration: underline; }

    h1, h2, h3, p { margin: 0; }
    h1 { font-size: clamp(28px, 4vw, 40px); }
    .subtitle, .hint, .empty p, .rationale, .source, .citation, .category, .status, .quiz-copy, .quiz-empty { color: var(--muted); }
    .subtitle { margin-top: 6px; max-width: 72ch; }
    .hint { font-size: 13px; margin-left: auto; }

    .progress {
      width: 100%;
      height: 12px;
      margin-top: 18px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(92, 107, 115, 0.14);
    }

    .progress > span {
      display: block;
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #0f766e, #14b8a6);
    }

    button,
    select,
    textarea {
      border: 1px solid rgba(216, 204, 187, 0.9);
      border-radius: 8px;
      background: var(--panel-strong);
      color: var(--text);
      font: inherit;
      padding: 11px 14px;
    }

    textarea {
      width: 100%;
      min-height: 124px;
      resize: vertical;
    }

    button {
      cursor: pointer;
      transition: border-color 120ms ease, background 120ms ease;
    }

    button:hover { border-color: #bfae96; }
    button.primary { background: var(--accent); color: #fff; border-color: transparent; }
    button.active { border-color: transparent; color: #fff; background: var(--accent); }
    button.active.right { background: var(--right); }
    button.active.wrong { background: var(--wrong); }
    button.active.hard { background: var(--hard); }
    button.subtle { background: rgba(255, 255, 255, 0.72); }
    button:disabled { cursor: not-allowed; opacity: 0.5; }

    .badge {
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 13px;
      border: 1px solid rgba(216, 204, 187, 0.85);
      background: rgba(255, 255, 255, 0.78);
    }

    .qnum { font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
    .question {
      margin-top: 18px;
      font: 700 clamp(26px, 4vw, 38px)/1.14 "Iowan Old Style", "Palatino Linotype", serif;
    }

    .meta { margin-top: 18px; }
    .meta strong { color: var(--text); }
    .meta .badge { font-size: 12px; }

    .choices {
      display: grid;
      gap: 12px;
      margin-top: 22px;
    }

    .choice {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      padding: 16px 18px;
      border-radius: 10px;
      border: 1px solid rgba(216, 204, 187, 0.9);
      background: rgba(255, 255, 255, 0.76);
      text-align: left;
    }

    .choice b {
      min-width: 28px;
      color: var(--accent);
      font-size: 18px;
    }

    .choice.selected { border-color: var(--accent); background: var(--accent-soft); }
    .choice.correct { border-color: rgba(47, 133, 90, 0.45); background: rgba(47, 133, 90, 0.12); }
    .choice.incorrect { border-color: rgba(192, 86, 33, 0.45); background: rgba(192, 86, 33, 0.12); }

    .panel {
      margin-top: 16px;
      padding: 18px 20px;
      border-radius: 10px;
      border: 1px solid rgba(216, 204, 187, 0.9);
      background: rgba(255, 255, 255, 0.76);
    }

    .panel h3,
    .quiz-detail h3 {
      margin: 0 0 8px;
      font-size: 15px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .source { font-style: italic; }
    .rationale { margin-top: 10px; }
    .status strong { color: var(--text); }

    .nav {
      justify-content: space-between;
      margin-top: 22px;
    }

    .empty {
      padding: 46px 24px;
      text-align: center;
    }

    .overview-actions { margin-top: 20px; }
    .persist-row { margin-top: 12px; }
    .overview-actions .primary { min-width: 180px; }
    .overview-note { margin-top: 18px; }
    .flash {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(216, 204, 187, 0.9);
      background: rgba(255, 255, 255, 0.76);
      color: var(--muted);
    }
    .flash.error {
      color: #9b2c2c;
      background: rgba(254, 226, 226, 0.72);
      border-color: rgba(192, 86, 33, 0.24);
    }
    .flash.success {
      color: #276749;
      background: rgba(220, 252, 231, 0.76);
      border-color: rgba(47, 133, 90, 0.24);
    }

    .quiz-shell {
      display: grid;
      gap: 12px;
      max-width: 980px;
      margin: 0 auto;
      padding: 14px;
      grid-template-columns: minmax(0, 1fr);
      grid-template-areas:
        "top"
        "question"
        "choices";
      align-items: start;
    }

    .quiz-shell.review-open {
      max-width: 1480px;
      grid-template-columns: minmax(0, 1.65fr) minmax(320px, 430px);
      grid-template-areas:
        "top top"
        "question sidebar"
        "choices sidebar";
    }

    .quiz-block {
      padding: 16px 18px;
      overflow: visible;
    }

    .quiz-topbar { grid-area: top; }
    .quiz-question { grid-area: question; }
    .quiz-answers { grid-area: choices; }
    .quiz-sidebar {
      grid-area: sidebar;
      display: grid;
      gap: 12px;
      align-content: start;
      min-width: 0;
    }

    .quiz-topbar .hint,
    .quiz-topbar .qnum { margin-left: 0; }
    .quiz-topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-left: auto;
    }
    .quiz-summary { gap: 8px; }
    .quiz-summary .badge,
    .quiz-actions .badge { font-size: 12px; }

    .quiz-question {
      display: grid;
      gap: 10px;
    }

    .quiz-question h2 {
      max-width: 19ch;
      font: 700 clamp(30px, 4vw, 44px)/1.06 "Iowan Old Style", "Palatino Linotype", serif;
    }

    .quiz-meta,
    .quiz-actions,
    .quiz-detail-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .quiz-choices {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .quiz-choices .choice {
      min-height: 100%;
      padding: 14px 16px;
    }

    .quiz-detail {
      display: grid;
      gap: 10px;
    }

    .quiz-detail-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .quiz-detail-copy {
      display: grid;
      gap: 12px;
      font-size: 14px;
      line-height: 1.4;
    }

    .note-panel {
      display: grid;
      gap: 8px;
    }

    .note-panel textarea {
      min-height: 200px;
      background: rgba(255, 255, 255, 0.92);
    }

    .note-panel .quiz-empty {
      font-size: 13px;
    }

    .quiz-detail-copy .source,
    .quiz-detail-copy .rationale { font-size: 14px; }

    @media (max-width: 720px) {
      .app { padding: 14px; }
      .shell, .card { padding: 18px; border-radius: 16px; }
      .nav { gap: 10px; }
      .nav > div { width: 100%; display: flex; gap: 10px; }
      .nav button { flex: 1; }
      .hint { width: 100%; margin-left: 0; }
      .app.quiz-screen { padding: 8px; }
      .quiz-shell {
        gap: 8px;
        padding: 8px;
        max-width: none;
      }
      .quiz-shell.review-open {
        grid-template-columns: 1fr;
        grid-template-areas:
          "top"
          "question"
          "choices"
          "sidebar";
      }
      .quiz-block { padding: 12px; border-radius: 14px; }
      .quiz-choices { grid-template-columns: 1fr; }
      .quiz-topbar-right {
        width: 100%;
        justify-content: space-between;
        margin-left: 0;
      }
      .quiz-question h2 { font-size: clamp(24px, 9vw, 36px); }
      .note-panel textarea { min-height: 140px; }
      button, select, textarea { padding: 10px 12px; }
    }
  </style>
</head>

    const CARDS = JSON.parse(atob(DATA_CHUNKS.join("")));
    const APP_NAME = "PA Psychology Law Study App";

    const LEGACY_STORAGE_KEY = "paPsychLawStudyStateV1";

    const APP = document.getElementById("app");

    const BY_ID = Object.fromEntries(CARDS.map(card => [card.id, card]));
    const FILTER_LABELS = { all: "All cards", unanswered: "Unanswered", wrong: "Wrong", hard: "Hard" };
    const SOURCE_FILES = {
      "One third this material.pdf": { label: "PA Professional Psychologists Practice Act", href: "pa-professional-psychologists-practice-act.pdf" },
      "pa-professional-psychologists-practice-act.pdf": { label: "PA Professional Psychologists Practice Act", href: "pa-professional-psychologists-practice-act.pdf" },
      "Two thirds this material.pdf": { label: "PA State Board of Psychology Regulations", href: "pa-state-board-of-psychology-regulations.pdf" },
      "pa-state-board-of-psychology-regulations.pdf": { label: "PA State Board of Psychology Regulations", href: "pa-state-board-of-psychology-regulations.pdf" }
    };
    let screen = "overview";
    let detail = "";
    let flash = null;

    function cardState() {
      return { selectedChoice: null, answered: false, wasCorrect: null, difficulty: "", lastReviewedAt: "", note: "" };
    }

    function defaultState() {
      return {
        version: STATE_VERSION,
        order: CARDS.map(card => card.id),
        currentIndex: 0,
        mode: "all",
        filter: "all",
        cards: {}
      };
    }

    function hydrate(raw) {
      const base = defaultState();
      if (!raw || typeof raw !== "object") return base;
      const validIds = new Set(base.order);
      const order = Array.isArray(raw.order) ? raw.order.filter(id => validIds.has(id)) : base.order;
      base.order = order.length === base.order.length ? order : base.order;
      base.currentIndex = Number.isInteger(raw.currentIndex) ? raw.currentIndex : 0;
      base.mode = raw.mode === "wrong" ? "wrong" : "all";
      base.filter = ["all", "unanswered", "wrong", "hard"].includes(raw.filter) ? raw.filter : "all";
      if (raw.cards && typeof raw.cards === "object") {
        for (const id of Object.keys(raw.cards)) {
          if (!validIds.has(Number(id))) continue;
          const item = raw.cards[id] || {};
          base.cards[id] = {
            selectedChoice: Number.isInteger(item.selectedChoice) ? item.selectedChoice : null,
            answered: item.answered === true,
            wasCorrect: item.wasCorrect === true ? true : item.wasCorrect === false ? false : null,
            difficulty: ["easy", "medium", "hard"].includes(item.difficulty) ? item.difficulty : "",
            lastReviewedAt: typeof item.lastReviewedAt === "string" ? item.lastReviewedAt : "",
            note: typeof item.note === "string" ? item.note : ""
          };
        }
      }
      return base;
    }

    function load() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) return hydrate(JSON.parse(saved));
        const legacy = localStorage.getItem(LEGACY_STORAGE_KEY);
        if (legacy) return hydrate(JSON.parse(legacy));
      } catch {
        return defaultState();
      }
      return defaultState();
    }

    function snapshotState(raw = state) {
      const next = hydrate(raw);
      next.version = STATE_VERSION;
      return next;
    }

    function exportPayload() {
      return {
        version: EXPORT_VERSION,
        exportedAt: new Date().toISOString(),
        app: APP_NAME,
        cardCount: CARDS.length,
        state: snapshotState(),
        cards: CARDS.map(card => ({ ...card }))
      };
    }

    function setFlash(text, tone = "success") {
      flash = text ? { text, tone } : null;
    }

    function sourceMeta(file) {
      return SOURCE_FILES[file] || { label: file, href: file };
    }

    function matchesDeck(cards) {
      if (!Array.isArray(cards) || cards.length !== CARDS.length) return false;
      const ids = new Set(cards.map(card => card && card.id));
      return ids.size === CARDS.length && CARDS.every(card => ids.has(card.id));
    }

    function importState(raw) {
      if (raw && typeof raw === "object" && raw.version === EXPORT_VERSION) {
        if (raw.cardCount !== CARDS.length) throw new Error("Saved file card count does not match this deck.");
        if (!matchesDeck(raw.cards)) throw new Error("Saved file was created for a different card set.");
        if (!raw.state || typeof raw.state !== "object") throw new Error("Saved file is missing study state.");
        return hydrate(raw.state);
      }
      if (raw && typeof raw === "object" && Array.isArray(raw.order) && raw.cards && typeof raw.cards === "object" && !Array.isArray(raw.cards)) {
        return hydrate(raw);
      }
      throw new Error("File format is not supported.");
    }

    function saveFile() {
      const blob = new Blob([JSON.stringify(exportPayload(), null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const stamp = new Date().toISOString().replaceAll(":", "-");
      const link = document.createElement("a");
      link.href = url;
      link.download = `pa-psych-law-study-${stamp}.json`;
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 0);
      setFlash("Study file downloaded.");
      render();
    }

    function loadFile(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          state = importState(JSON.parse(String(reader.result || "")));
          screen = "overview";
          detail = "";
          save();
          setFlash("Study file loaded.");
        } catch (error) {
          setFlash(error instanceof Error ? error.message : "Could not load that file.", "error");
        } finally {
          IMPORT_FILE.value = "";
          render();
        }
      };
      reader.onerror = () => {
        IMPORT_FILE.value = "";
        setFlash("The selected file could not be read.", "error");
        render();
      };
      reader.readAsText(file);
    }

    let state = load();

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(snapshotState()));
    }

    function syncScreen() {
      APP.className = `app ${screen}-screen`;
      document.body.classList.toggle("quiz-screen", screen === "quiz");
    }

    function entry(id) {
      return state.cards[id] || (state.cards[id] = cardState());
    }

    function shuffle(ids) {
      const next = [...ids];
      for (let i = next.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [next[i], next[j]] = [next[j], next[i]];
      }
      return next;
    }

    function list() {
      return state.order.filter(id => {
        const item = entry(id);
        if (state.mode === "wrong" && item.wasCorrect !== false) return false;
        if (state.filter === "unanswered" && item.answered) return false;
        if (state.filter === "wrong" && item.wasCorrect !== false) return false;
        if (state.filter === "hard" && item.difficulty !== "hard") return false;
        return true;
      });
    }

    function clamp(items) {
      if (!items.length) {
        state.currentIndex = 0;
        return;
      }
      state.currentIndex = Math.max(0, Math.min(state.currentIndex, items.length - 1));
    }

    function current(items = list()) {
      clamp(items);
      return items.length ? BY_ID[items[state.currentIndex]] : null;
    }

    function totals() {
      return CARDS.reduce((acc, card) => {
        const item = entry(card.id);
        if (item.answered) acc.answered += 1;
        if (item.wasCorrect === true) acc.right += 1;
        if (item.wasCorrect === false) acc.wrong += 1;
        if (item.difficulty === "hard") acc.hard += 1;
        return acc;
      }, { answered: 0, right: 0, wrong: 0, hard: 0 });
    }

    function esc(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function label(index) {
      return String.fromCharCode(65 + index);
    }

    function setGrade(card, wasCorrect) {
      const item = entry(card.id);
      const first = !item.answered;
      item.answered = true;
      item.wasCorrect = wasCorrect;
      item.lastReviewedAt = new Date().toISOString();
      if (first && !item.difficulty) item.difficulty = wasCorrect ? "easy" : "hard";
      save();
    }

    function setDetail(next) {
      detail = next;
      render();
    }

    function revealAnswer(card) {
      const item = entry(card.id);
      if (!item.answered && item.selectedChoice === null) return;
      detail = "answer";
      if (!item.answered) setGrade(card, item.selectedChoice === card.correct_choice);
      render();
    }

    function setSelection(card, choice) {
      const item = entry(card.id);
      item.selectedChoice = choice;
      save();
      if (detail !== "answer") return revealAnswer(card);
      setGrade(card, choice === card.correct_choice);
      render();
    }

    function setDifficulty(card, difficulty) {
      entry(card.id).difficulty = difficulty;
      save();
      render();
    }

    function setNote(card, note) {
      entry(card.id).note = note;
      save();
    }

    function nextCard(step) {
      const items = list();
      if (!items.length) return;
      state.currentIndex = (state.currentIndex + step + items.length) % items.length;
      detail = "";
      save();
      render();
    }

    function nextUnansweredIndex(items) {
      if (!items.length) return 0;
      for (let offset = 1; offset <= items.length; offset += 1) {
        const index = (state.currentIndex + offset) % items.length;
        if (!entry(items[index]).answered) return index;
      }
      return state.currentIndex < items.length ? state.currentIndex : 0;
    }

    function startQuiz() {
      const items = list();
      if (!items.length) return;
      state.currentIndex = nextUnansweredIndex(items);
      screen = "quiz";
      detail = "";
      save();
      render();
    }

    function resetWrongQueue() {
      for (const card of CARDS) {
        const item = entry(card.id);
        if (item.wasCorrect !== false) continue;
        item.selectedChoice = null;
        item.answered = false;
        item.wasCorrect = null;
        item.lastReviewedAt = "";
      }
      if (state.mode === "wrong") state.mode = "all";
      state.currentIndex = 0;
      detail = "";
      save();
    }

    function resetAllState() {
      state = defaultState();
      screen = "overview";
      detail = "";
      save();
    }

    function renderOverview(items, summary, progress) {

      const empty = !items.length;
      const practiceAct = sourceMeta("pa-professional-psychologists-practice-act.pdf");

      APP.innerHTML = `
        <section class="shell">
          <div class="topline">
            <div>
              <h1>${APP_NAME}</h1>
              <p class="subtitle">Start on overview, tune the session, then jump into a full-screen local study view.</p>
            </div>
            <div class="hint">Progress saves locally and can be exported to a file.</div>
          </div>
          <div class="stats">
            <span class="stat">Answered ${summary.answered}/${CARDS.length}</span>
            <span class="stat">Right ${summary.right}</span>
            <span class="stat">Wrong ${summary.wrong}</span>
            <span class="stat">Hard ${summary.hard}</span>
            <span class="stat">Visible ${items.length}</span>
          </div>
          <div class="progress"><span style="width:${progress}%"></span></div>
          <div class="controls overview-actions">
            <button data-action="start-quiz" class="primary"${empty ? " disabled" : ""}>${summary.answered ? "Resume study" : "Start study"}</button>

            <button data-action="reset-wrong">Reset wrong queue</button>
            <button data-action="reset-all">Reset all</button>
            <select data-action="filter">
              <option value="all"${state.filter === "all" ? " selected" : ""}>All cards</option>
              <option value="unanswered"${state.filter === "unanswered" ? " selected" : ""}>Unanswered</option>
              <option value="wrong"${state.filter === "wrong" ? " selected" : ""}>Wrong</option>
              <option value="hard"${state.filter === "hard" ? " selected" : ""}>Hard</option>
            </select>
          </div>
          <div class="controls persist-row">
            <button data-action="save-file">Save to file</button>
            <button data-action="load-file">Load file</button>
          </div>

          </div>
          ${flash ? `<div class="flash ${flash.tone}">${esc(flash.text)}</div>` : ""}
        </section>

        <section class="card${empty ? " empty" : ""}">
          <h2>${empty ? "No cards match this view." : summary.answered ? "Ready to resume." : "Ready to start."}</h2>
          <p class="subtitle">${empty ? "Change the filter, switch off wrong-only mode, or reset the wrong queue." : `Current scope: ${items.length} cards in ${state.mode === "wrong" ? "wrong-only" : "all-cards"} mode with the ${FILTER_LABELS[state.filter]} filter.`}</p>
          ${empty ? "" : `
            <div class="stats overview-note">
              <span class="stat">Next card ${currentCard ? currentCard.id : 1}</span>
              <span class="stat">Chunk ${currentCard ? esc(currentCard.source_chunk_id) : "-"}</span>

            </div>`}

    function renderQuiz(items, summary, progress) {
      const card = current(items);
      if (!card) {
        screen = "overview";
        return render();
      }
      const item = entry(card.id);
      const source = sourceMeta(card.source_file);
      const status = !item.answered ? "Unanswered" : item.wasCorrect ? "Marked right" : "Marked wrong";
      const reviewOpen = item.answered;
      const activeDetail = detail === "source" ? "source" : "answer";
      const noteBadge = item.note.trim() ? `<span class="badge">Note saved</span>` : "";
      const choices = card.choices.map((choice, index) => {

      APP.innerHTML = `

            ${reviewOpen ? `<div class="quiz-meta">
              <span class="badge"><strong>Chunk</strong> ${esc(card.source_chunk_id)}</span>
              <span class="badge"><strong>Citation</strong> ${esc(card.citation)}</span>
              ${item.difficulty ? `<span class="badge">Difficulty ${esc(item.difficulty)}</span>` : ""}
              ${noteBadge}
            </div>` : ""}

            <div class="quiz-choices">${choices}</div>

            <section class="quiz-block quiz-detail">
              ${detailBody}

            <section class="quiz-block note-panel">
              <h3>Card Note</h3>
              <p class="quiz-empty">Use notes for rewrites, source fixes, or anything you want to improve after the session.</p>
              <textarea data-action="note" placeholder="Add study notes, fixes, or rewrite ideas for this card.">${esc(item.note)}</textarea>
            </section>
          </aside>` : ""}
        </section>`;
    }

    function render() {
      const items = list();
      clamp(items);
      if (screen === "quiz" && !items.length) screen = "overview";
      syncScreen();
      const summary = totals();
      const progress = Math.round((summary.answered / CARDS.length) * 100);
      if (screen === "quiz") return renderQuiz(items, summary, progress);
      renderOverview(items, summary, progress);
    }

    document.addEventListener("click", event => {
      const button = event.target.closest("[data-action]");
      if (!button) return;
      const card = current();
      switch (button.dataset.action) {
        case "start-quiz":
          startQuiz();
          break;
        case "overview":
          screen = "overview";
          detail = "";
          render();
          break;
        case "choice":
          if (card) setSelection(card, Number(button.dataset.choice));
          break;
        case "source":
          if (card) setDetail("source");
          break;
        case "answer":
          if (card) revealAnswer(card);
          break;
        case "mark-right":
          if (card) { setGrade(card, true); render(); }
          break;
        case "mark-wrong":
          if (card) { setGrade(card, false); render(); }
          break;
        case "difficulty":
          if (card) setDifficulty(card, button.dataset.difficulty);
          break;
        case "prev":
          nextCard(-1);
          break;
        case "next":
          nextCard(1);
          break;
        case "shuffle":
          state.order = shuffle(CARDS.map(card => card.id));
          state.mode = "all";
          state.currentIndex = 0;
          detail = "";
          save();
          render();
          break;
        case "wrong":
          state.mode = "wrong";
          state.currentIndex = 0;
          detail = "";
          save();
          render();
          break;
        case "all":
          state.mode = "all";
          state.currentIndex = 0;
          detail = "";
          save();
          render();
          break;
        case "reset-wrong":
          resetWrongQueue();
          render();
          break;
        case "reset-all":
          if (window.confirm("Reset all progress, notes, and study history for every card?")) {
            resetAllState();
            setFlash("All study progress reset.");
            render();
          }
          break;
        case "save-file":
          saveFile();
          break;
        case "load-file":
          IMPORT_FILE.click();
          break;
        case "filter":
          break;
      }
    });

    document.addEventListener("change", event => {
      const target = event.target;
      if (target.matches('select[data-action="filter"]')) {
        state.filter = target.value;
        state.currentIndex = 0;
        detail = "";
        save();
        render();
      }
    });

    document.addEventListener("input", event => {
      const target = event.target;
      if (target.matches('textarea[data-action="note"]')) {
        const card = current();
        if (card) setNote(card, target.value);
      }
    });

    IMPORT_FILE.addEventListener("change", event => {
      const [file] = event.target.files || [];
      loadFile(file);
    });

    document.addEventListener("keydown", event => {
      const target = event.target;
      if (target && /SELECT|INPUT|TEXTAREA/.test(target.tagName)) return;
      if (screen !== "quiz") return;
      const card = current();
      if (!card) return;
      if (event.key >= "1" && event.key <= "4") {
        event.preventDefault();
        setSelection(card, Number(event.key) - 1);
      } else if (event.key === "Enter") {
        event.preventDefault();
        revealAnswer(card);
      } else if (event.key === "ArrowLeft") {
        event.preventDefault();
        nextCard(-1);
      } else if (event.key === "ArrowRight") {
        event.preventDefault();
        nextCard(1);
      } else if (event.key.toLowerCase() === "s") {
        event.preventDefault();
        setDetail("source");
      } else if (event.key.toLowerCase() === "a") {
        event.preventDefault();
        revealAnswer(card);
      } else if (event.key === "Escape") {
        event.preventDefault();
        screen = "overview";
        detail = "";
        render();
      }
    });

    render();
  </script>
</body>
</html>
