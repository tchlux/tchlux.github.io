    .stats,
    .meta,

## Card 1

- `id`: `1`
- `source_chunk_id`: `A06, A08`
- `source_file`: `pa-professional-psychologists-practice-act.pdf`
- `citation`: `Section 3; Section 3(3)`
- `category`: `scope/licensure`
- `answer`: `C`

### Question
An unlicensed social worker offers counseling that is consistent with social-work training and ethics, but advertises to the general public as a psychologist. What changes the legal result?

### Choices
- A. The overlapping professional training controls, so the person remains exempt
- B. The protected-title holdout changes the result; overlapping social-work practice may remain exempt, but offering services to the public under protected psychology titles is unlawful unless a statutory exemption applies
- C. The result turns only on whether the person uses psychological testing instruments
- D. The result turns only on whether the counseling is paid or unpaid

### Rationale
The protected-title holdout changes the result. Overlapping work by another recognized profession may remain exempt, but offering services to the public under protected psychology titles is unlawful unless a statutory exemption applies.

### Source Quote
Makes it unlawful to practice, offer to practice, or hold oneself out by psychology-based titles without a license, subject to stated exemptions. / Preserves work of qualified members of other recognized professions and volunteers in crisis or emergency situations when the work is consistent with their own training and ethics.

## Card 2

- `id`: `2`
- `source_chunk_id`: `A07`
- `source_file`: `pa-professional-psychologists-practice-act.pdf`
- `citation`: `Section 3(2)`
- `category`: `supervision/practice limits`
- `answer`: `C`

### Question
A treating psychologist encounters a medical issue outside the psychologist's competence but still relevant to the client's care. What is required?

### Choices
- A. Continue managing the outside issue if the client prefers integrated care
- B. Terminate all psychological treatment immediately
- C. Help the client obtain qualified professional assistance for the aspect outside the psychologist's competence
- D. Ignore the issue unless it later becomes the sole treatment focus

### Rationale
The psychologist must help the client obtain qualified care for the relevant problems outside the psychologist's competence.

### Source Quote
Exempts other healing arts licensees, prevents this act from authorizing psychologists to practice other healing arts, and requires psychologists to help clients obtain qualified care for issues outside their competence.

## Card 3

- `id`: `3`
- `source_chunk_id`: `A09`
- `source_file`: `pa-professional-psychologists-practice-act.pdf`
- `citation`: `Section 3(4); Section 3(4.1)`
- `category`: `supervision/practice limits`
- `answer`: `B`

### Question
A DHS employee selects, administers, scores, and interprets a psychological assessment. Before the report can be issued, what must occur?

### Choices
- A. A licensed psychologist must approve the test selection only
- B. A licensed psychologist must review the assessment and co-sign the report
- C. A psychologist may later audit a sample of reports instead
- D. No further step is required if the employee has graduate training

### Rationale
A licensed psychologist must review the assessment and co-sign the report.

### Source Quote
Exempts specified federal, correctional, human-services, and school-based psychology work done as part of normal employment and permits DOC or DHS employees to perform testing and assessment under licensed-psychologist review and cosignature.

## Card 4

- `category`: `supervision/practice limits`

### Question
A doctoral trainee in an accredited setting wants to rely on the statutory training exemption. What must be true about how the trainee is identified to others?

### Choices
- A. The trainee's title must clearly indicate training status
- B. The trainee may use any psychology title as long as supervision is available
- C. The trainee may omit training status because the setting is accredited
- D. The trainee's title must match the supervisor's full license title

### Rationale
The trainee's title must clearly indicate training status.

### Source Quote
Exempts faculty, staff, students, interns, residents, and researchers in accredited settings when work is part of their ordinary role or supervised course of study and trainee titles clearly indicate training status.

## Card 5

- `id`: `5`
- `source_chunk_id`: `A13`
- `source_file`: `pa-professional-psychologists-practice-act.pdf`
- `citation`: `Section 3(10.1)`
- `category`: `supervision/practice limits`
- `answer`: `D`

### Question
A person satisfied the grandfathering timing condition for school-psychology private practice years ago but is no longer employed by a Pennsylvania school or Department-of-Education-regulated program and no longer holds a valid Educational Specialist certificate in good standing. Which result follows?

### Choices
- A. The exemption remains vested because the historical timing gateway alone is enough
- B. The exemption is unavailable only because the person also lacks a psychology license
- C. The exemption remains available if the person previously practiced privately before leaving school employment
- D. The exemption is unavailable because current qualifying employment and a valid Educational Specialist I or II certificate in good standing are still required

### Rationale
No. The historical timing condition is only the gateway; qualifying employment and a valid Educational Specialist I or II certificate in good standing must still be satisfied.

### Source Quote
Grandfathers certain school psychologists for private practice if they timely completed or entered qualifying certification pathways, hold valid specialist certification, and work in qualifying educational settings.

## Card 6

- `source_chunk_id`: `A15, A16, A17`
- `source_file`: `pa-professional-psychologists-practice-act.pdf`

- `category`: `board powers/admin`
- `answer`: `D`

### Question
A Board member argues that the commissioner receives the same per diem as the other members and that remote participation automatically counts toward quorum and voting. Which statement is correct?

### Choices
- A. Both propositions are correct if the meeting minutes reflect the remote participation
- B. Only the per diem claim is wrong; remote participation still automatically counts toward quorum and voting
- C. Only the remote-participation claim is wrong; the commissioner receives the same per diem as the other members
- D. Both propositions are wrong: the commissioner does not receive the same per diem, and quorum or voting depend on the Act's attendance rules rather than automatic remote participation

### Rationale
Both parts are wrong. The commissioner is not paid the same per diem as the other members, and quorum or voting credit depends on the Act's attendance rules rather than automatic remote participation.

### Source Quote
Establishes the nine-member board, including citizenship and residency requirements, two public members, six licensed psychologists, and the commissioner as the ninth member. / Sets member terms, vacancies, quorum rules, physical-attendance voting limits, and a minimum of six meetings per year. / Covers annual officer selection, per diem and expenses, sunset review, and forfeiture rules for missed meetings or public-member training seminars.

## Card 7

- `id`: `7`

### Question
A psychologist says the Board can process licenses and complaints but cannot adopt practice standards or an ethics code. Which statement is correct?

### Choices
- A. Correct. The Board may enforce only standards written directly into the statute
- B. Correct. Ethics standards may be adopted only by national associations, not by the Board
- C. Incorrect. The Board's powers include adopting and revising regulations, professional-practice standards, and ethical standards, along with licensing and complaint functions
- D. Incorrect only because the Board may adopt ethics standards but not professional-practice standards

### Rationale
No. The Board's powers include adopting and revising regulations, professional-practice standards, and ethical standards, along with licensing, complaints, hearings, and prosecution authority.

### Source Quote
Grants authority over applicant qualifications, regulations, ethical standards, licensing decisions, hearings, complaints, prosecution, credential evaluation, and examination waivers.

## Card 8

### Question
If projected revenues will not cover projected enforcement expenditures, must the Board wait for individual legislation before increasing fees, and what reporting duty remains regardless?

### Choices
- A. Yes. Fees stay fixed unless separate legislation passes, and no annual reporting duty remains once a shortfall exists
- B. Yes. Fees stay fixed unless separate legislation passes, and the Board's only continuing duty is to notify licensees individually
- C. No. The fee structure may be increased by regulation when needed, and the Board still has annual financial and legislative reporting duties
- D. No. Fees may be increased by adjudication case by case, but the annual reporting duty stops during shortfall years

### Rationale
No. The fee structure may be increased by regulation when needed, and the Board still has its annual financial and legislative reporting duties.

### Source Quote
Allows board-set fees by regulation, bureau fee increases when needed for enforcement, deposit of fees and penalties into the augmentation account, and fees for exams, renewals, certifications, licensures, and applications. / Requires annual reporting of financial needs and budget requests and annual legislative reporting on complaint types, case status, board action, and time to resolution.

## Card 9

- `id`: `9`
- `source_chunk_id`: `A21, A22, A23`
- `source_file`: `pa-professional-psychologists-practice-act.pdf`
- `citation`: `Section 6(a)(1)-(4); Section 6(a)(5); Section 6(b); Section 6(c)`
- `category`: `qualifications/exams`
- `answer`: `C`

### Question
An applicant with a qualifying doctoral background and exam passage has a controlled-substance felony from 8 years ago and also makes a false sworn statement on the application. What two separate statutory barriers appear before ordinary licensure review?

### Choices
- A. None, because exam passage and later rehabilitation cure both issues at filing
- B. Only the false sworn statement matters because the felony bar expires after 5 years
- C. The application is blocked until 10 years have elapsed after the felony, and the false sworn statement creates separate perjury exposure
- D. Only the felony timing matters because false sworn statements count solely as discretionary character evidence

### Rationale
The application is blocked because at least 10 years must have elapsed after the specified controlled-substance felony before the person may qualify, and the false sworn statement creates separate perjury exposure.

### Source Quote
Requires acceptable moral character, qualifying doctoral education and supervised experience, passage of the board examination, and payment of required fees. / Bars licensure after specified controlled-substance felonies unless 10 years have elapsed, rehabilitation is shown, and all other qualifications are met. / Requires sworn truthfulness in applications with perjury exposure and permits a second examination after failure, with later eligibility governed by board regulation.

- `category`: `discipline/enforcement`
- `answer`: `B`

### Question
A psychologist argues that Pennsylvania may discipline only for in-state misconduct and not for certain convictions or disciplinary action taken elsewhere. What does the Act say?

### Choices
- A. Discipline is limited to misconduct that physically occurred in Pennsylvania
- B. Discipline may rest on specified convictions and diversionary dispositions, and also on disciplinary action by another jurisdiction
- C. Out-of-state discipline counts only if the other jurisdiction used procedures identical to Pennsylvania's
- D. Criminal dispositions count only after incarceration and never include diversionary outcomes

### Rationale
The Act authorizes discipline for specified convictions and diversionary dispositions and also for disciplinary action by another jurisdiction, not just for misconduct originating in Pennsylvania.

### Source Quote
Authorizes discipline for failure to meet licensure standards, misleading practice representations, fraud in obtaining a license, gross incompetence or misconduct, and false biennial registration. / Authorizes discipline for felony convictions, certain practice-related misdemeanors, specified diversionary dispositions, and disciplinary action by another jurisdiction.

- `citation`: `Section 8(a)(8)`
- `category`: `discipline/enforcement`

### Question
A psychologist refuses a Board-directed physical or mental examination without circumstances beyond the psychologist's control. What is the regulatory effect?

### Choices
- A. No effect unless criminal charges are filed
- B. Automatic restoration of the license
- C. The refusal is treated as an admission of the allegations, permitting default and final order without testimony or evidence
- D. The refusal is treated only as a CE deficiency

### Rationale
The refusal may be treated as an admission, and the licensee may later present proof of recovery.

### Source Quote
Authorizes discipline for inability to practice safely due to impairment, permits compelled mental or physical examinations, treats unjustified refusal as an admission, and allows later proof of recovery.

### Question
After finding discipline grounds, may the Board only revoke or suspend, or does the sanction menu include a treatment-directed remedy as well?

### Choices
- A. The Board may only revoke or suspend; it may not impose treatment-directed conditions
- B. The Board may order treatment only if the licensee first agrees in writing to waive appeal rights
- C. The Board may jail the licensee directly if the licensee refuses treatment
- D. The sanction menu is broader and may require care, counseling, or treatment from a Board-designated physician or psychologist

### Rationale
The sanction menu is broader. It includes lesser sanctions and may require the licensee to obtain care, counseling, or treatment from a Board-designated physician or psychologist.

### Source Quote
Lists available sanctions from denial through probation and corrective treatment while preserving notice, hearing, adjudication, and appeal rights.

### Question
Compare these triggers. Case 1: the Board finds an immediate and clear danger to public health and safety. Case 2: the licensee is legally committed for mental incompetence or is convicted of a specified controlled-substance felony. Which suspension mechanism applies?

### Choices
- A. Automatic suspension applies in both cases, and a stay remains available pending appeal
- B. Temporary suspension applies in both cases, followed by the same prompt prima facie hearing
- C. Case 1 permits temporary suspension with a prompt prima facie hearing, while Case 2 triggers automatic suspension without a stay pending appeal
- D. Case 1 requires an automatic suspension first, while Case 2 remains temporary until the criminal or commitment appeal ends

### Rationale
Case 1 uses temporary suspension; Case 2 uses automatic suspension.

### Source Quote
Allows immediate temporary suspension when there is an immediate and clear danger, followed by a prompt prima facie hearing with defined participation rights and a 180-day maximum duration. / Provides automatic suspension upon mental incompetency commitment or specified controlled-substance felony convictions, without a stay pending appeal.

    function escapeRegex(text) {
      return text.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

    function parseCardsMarkdown(raw) {
      const text = raw.replace(/\r\n?/g, "\n").trim();
      if (!text) throw new Error("No embedded card content found. Run `python3 sync_cards.py`.");

      if (!matches.length) throw new Error("No cards found in embedded markdown.");
      const ids = new Set();
      const chunks = new Set();
      return matches.map(match => {
        const headingId = Number(match[1]);
        const body = match[2].trim();
        const field = name => {
          const found = body.match(new RegExp(`^- \`${escapeRegex(name)}\`: \`(.+?)\`$`, "m"));
          if (!found) throw new Error(`Card ${headingId} is missing field '${name}'.`);
          return found[1];
        };
        const section = name => {
          const found = body.match(new RegExp(`^### ${escapeRegex(name)}\n([\\s\\S]*?)(?=^### |(?![\\s\\S]))`, "m"));

          return found[1].trim();
        };
        const fieldId = Number(field("id"));
        if (fieldId !== headingId) throw new Error(`Card ${headingId} has mismatched id field ${fieldId}.`);
        if (ids.has(fieldId)) throw new Error(`Duplicate card id ${fieldId}.`);
        ids.add(fieldId);
        const sourceChunkId = field("source_chunk_id");
        if (chunks.has(sourceChunkId)) throw new Error(`Duplicate source chunk ${sourceChunkId}.`);
        chunks.add(sourceChunkId);

        const choiceLines = section("Choices").split("\n").map(line => line.trim()).filter(Boolean);

        if (!raw.state || typeof raw.state !== "object") throw new Error("Saved file is missing study state.");
        return hydrate(raw.state);
      }
      if (raw && typeof raw === "object" && Array.isArray(raw.order) && raw.cards && typeof raw.cards === "object" && !Array.isArray(raw.cards)) {
        return hydrate(raw);
      }
      throw new Error("File format is not supported.");
    }

    function saveFile() {
      const blob = new Blob([JSON.stringify(exportPayload(), null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const stamp = new Date().toISOString().replaceAll(":", "-");
      const link = document.createElement("a");
      link.href = url;
      link.download = `pa-psych-law-study-${stamp}.json`;
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 0);
      setFlash("Study file downloaded.");
      render();
    }

    function loadFile(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          state = importState(JSON.parse(String(reader.result || "")));
          screen = "overview";
          detail = "";
          save();
          setFlash("Study file loaded.");
        } catch (error) {
          setFlash(error instanceof Error ? error.message : "Could not load that file.", "error");
        } finally {
          IMPORT_FILE.value = "";
          render();
        }
      };
      reader.onerror = () => {
        IMPORT_FILE.value = "";
        setFlash("The selected file could not be read.", "error");
        render();
      };
      reader.readAsText(file);
    }

    let state = load();

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(snapshotState()));
    }

    function syncScreen() {
      APP.className = `app ${screen}-screen`;
      document.body.classList.toggle("quiz-screen", screen === "quiz");
    }

    function entry(id) {
      return state.cards[id] || (state.cards[id] = cardState());
    }

    function shuffle(ids) {
      const next = [...ids];
      for (let i = next.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [next[i], next[j]] = [next[j], next[i]];
      }
      return next;
    }

    function list() {
      return state.order.filter(id => {
        const item = entry(id);
        if (state.mode === "wrong" && item.wasCorrect !== false) return false;
        if (state.filter === "unanswered" && item.answered) return false;
        if (state.filter === "wrong" && item.wasCorrect !== false) return false;
        if (state.filter === "hard" && item.difficulty !== "hard") return false;
        return true;
      });
    }

    function clamp(items) {
      if (!items.length) {
        state.currentIndex = 0;
        return;
      }
      state.currentIndex = Math.max(0, Math.min(state.currentIndex, items.length - 1));
    }

    function current(items = list()) {
      clamp(items);
      return items.length ? BY_ID[items[state.currentIndex]] : null;
    }

    function totals() {
      return CARDS.reduce((acc, card) => {
        const item = entry(card.id);
        if (item.answered) acc.answered += 1;
        if (item.wasCorrect === true) acc.right += 1;
        if (item.wasCorrect === false) acc.wrong += 1;
        if (item.difficulty === "hard") acc.hard += 1;
        return acc;
      }, { answered: 0, right: 0, wrong: 0, hard: 0 });
    }

    function esc(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function label(index) {
      return String.fromCharCode(65 + index);
    }

    function setGrade(card, wasCorrect) {
      const item = entry(card.id);
      const first = !item.answered;
      item.answered = true;
      item.wasCorrect = wasCorrect;
      item.lastReviewedAt = new Date().toISOString();
      if (first && !item.difficulty) item.difficulty = wasCorrect ? "easy" : "hard";
      save();
    }

    function setDetail(next) {
      detail = next;
      render();
    }

    function revealAnswer(card) {
      const item = entry(card.id);
      if (!item.answered && item.selectedChoice === null) return;
      detail = "answer";
      if (!item.answered) setGrade(card, item.selectedChoice === card.correct_choice);
      render();
    }

    function setSelection(card, choice) {
      const item = entry(card.id);
      item.selectedChoice = choice;
      save();
      if (detail !== "answer") return revealAnswer(card);
      setGrade(card, choice === card.correct_choice);
      render();
    }

    function setDifficulty(card, difficulty) {
      entry(card.id).difficulty = difficulty;
      save();
      render();
    }

    function setNote(card, note) {
      entry(card.id).note = note;
      save();
    }

    function nextCard(step) {
      const items = list();
      if (!items.length) return;
      state.currentIndex = (state.currentIndex + step + items.length) % items.length;
      detail = "";
      save();
      render();
    }

    function nextUnansweredIndex(items) {
      if (!items.length) return 0;
      const currentIndex = state.currentIndex < items.length ? state.currentIndex : 0;
      if (!entry(items[currentIndex]).answered) return currentIndex;
      for (let offset = 1; offset <= items.length; offset += 1) {
        const index = (currentIndex + offset) % items.length;
        if (!entry(items[index]).answered) return index;
      }
      return currentIndex;
    }

    function startQuiz() {
      const items = list();
      if (!items.length) return;
      state.currentIndex = nextUnansweredIndex(items);
      screen = "quiz";
      detail = "";
      save();
      render();
    }

    function resetWrongQueue() {
      for (const card of CARDS) {
        const item = entry(card.id);
        if (item.wasCorrect !== false) continue;
        item.selectedChoice = null;
        item.answered = false;
        item.wasCorrect = null;
        item.lastReviewedAt = "";
      }
      if (state.mode === "wrong") state.mode = "all";
      state.currentIndex = 0;
      detail = "";
      save();
    }

    function resetAllState() {
      state = defaultState();
      screen = "overview";
      detail = "";
      save();
    }

    function renderDataError() {
      APP.innerHTML = `
        <section class="shell">
          <div class="topline">
            <div>
              <h1>${APP_NAME}</h1>
              <p class="subtitle">Study cards failed to load.</p>
            </div>
            <div class="hint">Run <code>python3 sync_cards.py</code> after editing <code>cards.md</code>.</div>
          </div>
        </section>

        <section class="card empty">
          <h2>Content Error</h2>
          <p class="subtitle">${esc(DATA_ERROR)}</p>
        </section>`;
    }

    function renderOverview(items, summary, progress) {
      const currentCard = current(items);
      const empty = !items.length;
      const practiceAct = sourceMeta("pa-professional-psychologists-practice-act.pdf");
      const regulations = sourceMeta("pa-state-board-of-psychology-regulations.pdf");
      APP.innerHTML = `
        <section class="shell">
          <div class="topline">
            <div>
              <h1>${APP_NAME}</h1>
              <p class="subtitle">Start on overview, tune the session, then jump into a full-screen local study view.</p>
            </div>
            <div class="hint">Progress saves locally and can be exported to a file.</div>
          </div>
          <div class="stats">
            <span class="stat">Answered ${summary.answered}/${CARDS.length}</span>
            <span class="stat">Right ${summary.right}</span>
            <span class="stat">Wrong ${summary.wrong}</span>
            <span class="stat">Hard ${summary.hard}</span>
            <span class="stat">Visible ${items.length}</span>
          </div>
          <div class="progress"><span style="width:${progress}%"></span></div>
          <div class="controls overview-actions">
            <button data-action="start-quiz" class="primary"${empty ? " disabled" : ""}>${summary.answered ? "Resume study" : "Start study"}</button>
            <button data-action="shuffle">Shuffle all</button>
            <button data-action="wrong"${state.mode === "wrong" ? ' class="active wrong"' : ""}>Wrong only</button>
            <button data-action="all"${state.mode === "all" ? ' class="subtle"' : ""}>All cards</button>
            <button data-action="reset-wrong">Reset wrong queue</button>
            <button data-action="reset-all">Reset all</button>
            <select data-action="filter">
              <option value="all"${state.filter === "all" ? " selected" : ""}>All cards</option>
              <option value="unanswered"${state.filter === "unanswered" ? " selected" : ""}>Unanswered</option>
              <option value="wrong"${state.filter === "wrong" ? " selected" : ""}>Wrong</option>
              <option value="hard"${state.filter === "hard" ? " selected" : ""}>Hard</option>
            </select>
          </div>
          <div class="controls persist-row">
            <button data-action="save-file">Save to file</button>
            <button data-action="load-file">Load file</button>
          </div>
          <div class="stats overview-note">
            <a class="stat" href="${practiceAct.href}">${practiceAct.label} PDF</a>
            <a class="stat" href="${regulations.href}">${regulations.label} PDF</a>
          </div>
          ${flash ? `<div class="flash ${flash.tone}">${esc(flash.text)}</div>` : ""}
        </section>

        <section class="card${empty ? " empty" : ""}">
          <h2>${empty ? "No cards match this view." : summary.answered ? "Ready to resume." : "Ready to start."}</h2>
          <p class="subtitle">${empty ? "Change the filter, switch off wrong-only mode, or reset the wrong queue." : `Current scope: ${items.length} cards in ${state.mode === "wrong" ? "wrong-only" : "all-cards"} mode with the ${FILTER_LABELS[state.filter]} filter.`}</p>
          ${empty ? "" : `
            <div class="stats overview-note">
              <span class="stat">Next card ${currentCard ? currentCard.id : 1}</span>
              <span class="stat">Chunk ${currentCard ? esc(currentCard.source_chunk_id) : "-"}</span>
              <span class="stat">Position ${state.currentIndex + 1} of ${items.length}</span>
            </div>`}
        </section>`;
    }

    function renderQuiz(items, summary, progress) {
      const card = current(items);
      if (!card) {
        screen = "overview";
        return render();
      }
      const item = entry(card.id);
      const source = sourceMeta(card.source_file);
      const status = !item.answered ? "Unanswered" : item.wasCorrect ? "Marked right" : "Marked wrong";
      const reviewOpen = item.answered;
      const activeDetail = detail === "source" ? "source" : "answer";
      const noteBadge = item.note.trim() ? `<span class="badge">Note saved</span>` : "";
      const choices = card.choices.map((choice, index) => {
        const classes = ["choice"];
        if (item.selectedChoice === index) classes.push("selected");
        if (reviewOpen && index === card.correct_choice) classes.push("correct");
        if (reviewOpen && item.selectedChoice === index && index !== card.correct_choice) classes.push("incorrect");
        return `<button class="${classes.join(" ")}" data-action="choice" data-choice="${index}"><b>${label(index)}</b><span>${esc(choice)}</span></button>`;
      }).join("");
      const detailBody = activeDetail === "source" ? `
        <div class="quiz-detail-top">
          <h3>Source</h3>
          <button data-action="answer">Answer</button>
        </div>
        <div class="quiz-detail-copy">
          <div class="quiz-detail-grid">
            <span class="badge"><strong>Chunk</strong> ${esc(card.source_chunk_id)}</span>
            <span class="badge"><strong>Citation</strong> ${esc(card.citation)}</span>
            <span class="badge"><strong>Category</strong> ${esc(card.category)}</span>
            <span class="badge"><strong>Source</strong> <a class="source-link" href="${source.href}">${esc(source.label)}</a></span>
          </div>
          <p class="source">${esc(card.source_quote)}</p>
        </div>` : `
        <div class="quiz-detail-top">
          <h3>Answer</h3>
          <button data-action="source">Source</button>
        </div>
        <div class="quiz-detail-copy">
          <div class="status"><strong>Correct choice:</strong> ${label(card.correct_choice)}. ${esc(card.choices[card.correct_choice])}</div>
          <p class="rationale">${esc(card.rationale)}</p>
          <div class="grade-row">
            <button data-action="mark-right"${item.wasCorrect === true ? ' class="active right"' : ""}>Mark right</button>
            <button data-action="mark-wrong"${item.wasCorrect === false ? ' class="active wrong"' : ""}>Mark wrong</button>
            <span class="badge">${status}</span>
          </div>
          <div class="difficulty-row">
            <span class="status">Difficulty:</span>
            <button data-action="difficulty" data-difficulty="easy"${item.difficulty === "easy" ? ' class="active right"' : ""}>Easy</button>
            <button data-action="difficulty" data-difficulty="medium"${item.difficulty === "medium" ? ' class="active"' : ""}>Medium</button>
            <button data-action="difficulty" data-difficulty="hard"${item.difficulty === "hard" ? ' class="active hard"' : ""}>Hard</button>
          </div>
        </div>`;

      APP.innerHTML = `
        <section class="quiz-shell${reviewOpen ? " review-open" : ""}">
          <section class="quiz-block quiz-topbar">
            <div class="quiz-meta">
              <button data-action="overview">Overview</button>
            </div>
            <div class="quiz-topbar-right">
              <button data-action="prev">Previous</button>
              <button data-action="next" class="primary">Next</button>
              <div class="qnum">${state.currentIndex + 1} of ${items.length}</div>
            </div>
          </section>

          <section class="quiz-block quiz-question">
            <h2>${esc(card.question)}</h2>
            ${reviewOpen ? `<div class="quiz-meta">
              <span class="badge"><strong>Chunk</strong> ${esc(card.source_chunk_id)}</span>
              <span class="badge"><strong>Citation</strong> ${esc(card.citation)}</span>
              ${item.difficulty ? `<span class="badge">Difficulty ${esc(item.difficulty)}</span>` : ""}
              ${noteBadge}
            </div>` : ""}
          </section>

          <section class="quiz-block quiz-answers">
            <div class="quiz-choices">${choices}</div>
          </section>

          ${reviewOpen ? `<aside class="quiz-sidebar">
            <section class="quiz-block quiz-detail">
              ${detailBody}
            </section>
            <section class="quiz-block note-panel">
              <h3>Card Note</h3>
              <p class="quiz-empty">Use notes for rewrites, source fixes, or anything you want to improve after the session.</p>
              <textarea data-action="note" placeholder="Add study notes, fixes, or rewrite ideas for this card.">${esc(item.note)}</textarea>
            </section>
          </aside>` : ""}
        </section>`;
    }

    function render() {
      if (DATA_ERROR) {
        syncScreen();
        return renderDataError();
      }
      const items = list();
      clamp(items);
      if (screen === "quiz" && !items.length) screen = "overview";
      syncScreen();
      const summary = totals();
      const progress = Math.round((summary.answered / CARDS.length) * 100);
      if (screen === "quiz") return renderQuiz(items, summary, progress);
      renderOverview(items, summary, progress);
    }

    document.addEventListener("click", event => {
      const button = event.target.closest("[data-action]");
      if (!button) return;
      const card = current();
      switch (button.dataset.action) {
        case "start-quiz":
          startQuiz();
          break;
        case "overview":
          screen = "overview";
          detail = "";
          render();
          break;
        case "choice":
          if (card) setSelection(card, Number(button.dataset.choice));
          break;
        case "source":
          if (card) setDetail("source");
          break;
        case "answer":
          if (card) revealAnswer(card);
          break;
        case "mark-right":
          if (card) { setGrade(card, true); render(); }
          break;
        case "mark-wrong":
          if (card) { setGrade(card, false); render(); }
          break;
        case "difficulty":
          if (card) setDifficulty(card, button.dataset.difficulty);
          break;
        case "prev":
          nextCard(-1);
          break;
        case "next":
          nextCard(1);
          break;
        case "shuffle":
          state.order = shuffle(CARDS.map(card => card.id));
          state.mode = "all";
          state.currentIndex = 0;
          detail = "";
          save();
          render();
          break;
        case "wrong":
          state.mode = "wrong";
          state.currentIndex = 0;
          detail = "";
          save();
          render();
          break;
        case "all":
          state.mode = "all";
          state.currentIndex = 0;
          detail = "";
          save();
          render();
          break;
        case "reset-wrong":
          resetWrongQueue();
          render();
          break;
        case "reset-all":
          if (window.confirm("Reset all progress, notes, and study history for every card?")) {
            resetAllState();
            setFlash("All study progress reset.");
            render();
          }
          break;
        case "save-file":
          saveFile();
          break;
        case "load-file":
          IMPORT_FILE.click();
          break;
        case "filter":
          break;
      }
    });

    document.addEventListener("change", event => {
      const target = event.target;
      if (target.matches('select[data-action="filter"]')) {
        state.filter = target.value;
        state.currentIndex = 0;
        detail = "";
        save();
        render();
      }
    });

    document.addEventListener("input", event => {
      const target = event.target;
      if (target.matches('textarea[data-action="note"]')) {
        const card = current();
        if (card) setNote(card, target.value);
      }
    });

    IMPORT_FILE.addEventListener("change", event => {
      const [file] = event.target.files || [];
      loadFile(file);
    });

    document.addEventListener("keydown", event => {
      const target = event.target;
      if (target && /SELECT|INPUT|TEXTAREA/.test(target.tagName)) return;
      if (screen !== "quiz") return;
      const card = current();
      if (!card) return;
      if (event.key >= "1" && event.key <= "4") {
        event.preventDefault();
        setSelection(card, Number(event.key) - 1);
      } else if (event.key === "Enter") {
        event.preventDefault();
        revealAnswer(card);
      } else if (event.key === "ArrowLeft") {
        event.preventDefault();
        nextCard(-1);
      } else if (event.key === "ArrowRight") {
        event.preventDefault();
        nextCard(1);
      } else if (event.key.toLowerCase() === "s") {
        event.preventDefault();
        setDetail("source");
      } else if (event.key.toLowerCase() === "a") {
        event.preventDefault();
        revealAnswer(card);
      } else if (event.key === "Escape") {
        event.preventDefault();
        screen = "overview";
        detail = "";
        render();
      }
    });

    render();
  </script>
</body>
</html>
